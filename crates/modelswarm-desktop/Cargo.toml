[package]
name = "modelswarm-desktop"
description = "ModelSwarm desktop UI shell (Tauri 2, ADR-008)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
# The real Tauri 2 shell. OFF by default so the workspace builds anywhere
# (the tauri/wry dependency tree is heavy and platform-specific). Enable with
# `cargo check -p modelswarm-desktop --features tauri-shell`. See
# docs/verification/phase-g-notes.md for the Phase G attempt outcome.
tauri-shell = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-build",
    "dep:modelswarm-node",
    "dep:modelswarm-tracker-api",
    "dep:modelswarm-store",
    "dep:modelswarm-gateway",
    "dep:modelswarm-identity",
    "dep:modelswarm-telemetry",
    "dep:futures-util",
    "dep:tokio",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
]

[target.'cfg(windows)'.dependencies]
modelswarm-winjob = { path = "../modelswarm-winjob" }

[dependencies]
modelswarm-transport = { path = "../modelswarm-transport", features = ["libp2p-backend"] }

tauri = { version = "2", optional = true, default-features = false, features = ["wry"] }
tauri-plugin-opener = { version = "2", optional = true }
modelswarm-node = { path = "../modelswarm-node", optional = true, features = ["libp2p-backend"] }
modelswarm-tracker-api = { path = "../modelswarm-tracker-api", optional = true }
modelswarm-store = { path = "../modelswarm-store", optional = true }
modelswarm-gateway = { path = "../modelswarm-gateway", optional = true }
modelswarm-identity = { path = "../modelswarm-identity", optional = true }
modelswarm-telemetry = { path = "../modelswarm-telemetry", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "rt", "sync", "time"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[build-dependencies]
tauri-build = { version = "2", optional = true, default-features = false , features = [] }

[lints]
workspace = true
