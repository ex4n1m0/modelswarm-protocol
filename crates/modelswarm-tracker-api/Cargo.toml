[package]
name = "modelswarm-tracker-api"
description = "Typed Rust client for the modelswarm.deepflux.space tracker API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
modelswarm-identity = { path = "../modelswarm-identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls"] }
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

[lints]
workspace = true
