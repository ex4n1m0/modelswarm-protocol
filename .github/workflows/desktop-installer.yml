# Phase I3: one release, all OSes together (owner directive 2026-10-05).
# Every change bumps tauri.conf.json version AND builds Windows + Linux +
# macOS in the same run. (Intel-mac dropped: GitHub retired the macos-13
# runners — the macos-x64 engine pins remain in runtime-pins.json for when
# a cross-compile target is wired up.) The pinned llama.cpp engine (runtime-pins.json,
# platforms{}) is hash-verified per OS before bundling; model weights are
# NEVER bundled (first-run download per ADR-008).
name: desktop-installer
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["crates/modelswarm-desktop/**", "crates/modelswarm-node/**", "runtime-pins.json", ".github/workflows/desktop-installer.yml"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
            archive: https://github.com/ggml-org/llama.cpp/releases/download/b11407/llama-b11407-bin-win-cpu-x64.zip
            archive_sha: 353c4aab423bff5cb6dc0e1d32e41a447990ab3d69a411b7f58ff48187c91a03
            gpu_archive: https://github.com/ggml-org/llama.cpp/releases/download/b11407/llama-b11407-bin-win-vulkan-x64.zip
            gpu_archive_sha: a56279698e17484bfb55eaf98c16e4b7414481675ac94b309b5372aa73ae6f2a
          - os: ubuntu-latest
            platform: linux-x64
            bundles: deb,appimage
            archive: https://github.com/ggml-org/llama.cpp/releases/download/b11407/llama-b11407-bin-ubuntu-x64.tar.gz
            archive_sha: 086d6289901545b664b70fe032b49d5c0e3e242e5d07540d18b573603c563529
          - os: macos-latest
            platform: macos-arm64
            bundles: dmg
            archive: https://github.com/ggml-org/llama.cpp/releases/download/b11407/llama-b11407-bin-macos-arm64.tar.gz
            archive_sha: 23dc51ce360ffaf0753cb3257b4020b9d7d9da2215198a81ce187d29aa7801f7
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Fetch pinned engine (${{ matrix.platform }})
        shell: bash
        run: |
          mkdir -p crates/modelswarm-desktop/engine
          curl -sSL -o engine.archive "$ARCHIVE"
          echo "$ARCHIVE_SHA  engine.archive" | sha256sum -c -
          case "$ARCHIVE" in
            *.zip) unzip -j -o engine.archive -d crates/modelswarm-desktop/engine ;;
            *.tar.gz) tar -xzf engine.archive --strip-components=1 -C crates/modelswarm-desktop/engine ;;
          esac
          ls crates/modelswarm-desktop/engine | head -8
        env:
          ARCHIVE: ${{ matrix.archive }}
          ARCHIVE_SHA: ${{ matrix.archive_sha }}
      - name: Fetch GPU engine variant (ADR-024; windows only)
        shell: bash
        run: |
          mkdir -p crates/modelswarm-desktop/engine-vulkan
          if [ -n "$GPU_ARCHIVE" ]; then
            curl -sSL -o engine-vulkan.archive "$GPU_ARCHIVE"
            echo "$GPU_ARCHIVE_SHA  engine-vulkan.archive" | sha256sum -c -
            unzip -j -o engine-vulkan.archive -d crates/modelswarm-desktop/engine-vulkan
            ls crates/modelswarm-desktop/engine-vulkan | wc -l
          else
            # Non-Windows: keep the resource glob non-empty; the node never
            # resolves (or starts) a GPU variant on these platforms.
            printf 'Windows-only GPU engine variant (ADR-024). This platform ships the canonical CPU engine only.\n' > crates/modelswarm-desktop/engine-vulkan/README.txt
          fi
        env:
          GPU_ARCHIVE: ${{ matrix.gpu_archive }}
          GPU_ARCHIVE_SHA: ${{ matrix.gpu_archive_sha }}
      - name: Verify every pinned engine file (runtime-pins.json)
        shell: pwsh
        run: |
          $pins = Get-Content runtime-pins.json -Raw | ConvertFrom-Json
          $entry = $pins.platforms.'${{ matrix.platform }}'
          $dir = "crates/modelswarm-desktop/engine"
          $verified = 0
          foreach ($prop in $entry.files.PSObject.Properties) {
            $f = $prop.Name
            $actual = (Get-FileHash "$dir/$f" -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $prop.Value) { throw "engine file $f hash mismatch" }
            $verified++
          }
          foreach ($f in $entry.bundle) {
            if (-not (Test-Path "$dir/$f")) { throw "bundled engine entry missing: $f" }
          }
          Write-Host "engine verified ($verified files hashed, $($entry.bundle.Count) entries present)"
          if ('${{ matrix.platform }}' -eq 'windows-x64') {
            $variant = $pins.platforms.'windows-x64'.variants.vulkan
            $vdir = "crates/modelswarm-desktop/engine-vulkan"
            $vverified = 0
            foreach ($prop in $variant.files.PSObject.Properties) {
              $f = $prop.Name
              $actual = (Get-FileHash "$vdir/$f" -Algorithm SHA256).Hash.ToLower()
              if ($actual -ne $prop.Value) { throw "vulkan engine file $f hash mismatch" }
              $vverified++
            }
            foreach ($f in $variant.bundle) {
              if (-not (Test-Path "$vdir/$f")) { throw "vulkan bundled engine entry missing: $f" }
            }
            Write-Host "vulkan variant verified ($vverified files hashed, $($variant.bundle.Count) entries present)"
          }
      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build ${{ matrix.bundles }} installer
        shell: bash
        run: |
          cd crates/modelswarm-desktop
          cargo tauri build --bundles ${{ matrix.bundles }} -- --features tauri-shell
      - name: Collect + hash artifacts
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -maxdepth 3 \( -name "*-setup.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) -exec cp {} dist/ \;
          cd dist && ls -la && shopt -s nullglob && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Verify the engine is INSIDE each built artifact
        shell: bash
        run: |
          # v0.2.2 shipped a silently engine-less installer: staging was
          # verified but the bundle glob matched nothing. Open every real
          # artifact and require the pinned engine binary inside it.
          set -e
          cd dist
          shopt -s nullglob
          for f in *-setup.exe; do
            # NSIS listings use backslash paths; deb/AppImage/dmg use forward
            # slashes — accept both (v0.2.17's first run failed on exactly this).
            7z l "$f" | grep -E "engine[/\\]llama-server\.exe" || { echo "::error::engine missing in $f"; 7z l "$f" | grep -iE "llama|engine" | head -20; exit 1; }
            7z l "$f" | grep -E "engine-vulkan[/\\]llama-server\.exe" || { echo "::error::vulkan engine variant missing in $f"; 7z l "$f" | grep -iE "llama|engine" | head -20; exit 1; }
            echo "engine + vulkan variant present in $f"
          done
          for f in *.deb; do
            # Not piped into grep -q: early pipe-close kills tar (SIGPIPE).
            dpkg-deb -c "$f" > deb-contents.txt
            grep -q "engine/llama-server$" deb-contents.txt || { echo "::error::engine missing in $f"; exit 1; }
            echo "engine present in $f"
          done
          for f in *.AppImage; do
            chmod +x "$f"
            "./$f" --appimage-extract >/dev/null 2>&1 || true
            find squashfs-root -path "*engine/llama-server" | grep -q . || { echo "::error::engine missing in $f"; rm -rf squashfs-root; exit 1; }
            rm -rf squashfs-root
            echo "engine present in $f"
          done
          for f in *.dmg; do
            m=$(hdiutil attach -nobrowse -readonly "$f" | tail -1 | awk '{for(i=NF;i>0;i--) if($i ~ /^\//) {print $i; exit}}')
            find "$m" -path "*engine/llama-server" | grep -q . || { hdiutil detach "$m" >/dev/null; echo "::error::engine missing in $f"; exit 1; }
            hdiutil detach "$m" >/dev/null
            echo "engine present in $f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: modelswarm-installer-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
