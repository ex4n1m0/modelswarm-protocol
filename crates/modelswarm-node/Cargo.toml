[package]
name = "modelswarm-node"
description = "ModelSwarm Windows background node daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# F0(3): P2P serving bridge (libp2p listener -> executor).
libp2p-backend = ["dep:modelswarm-transport", "dep:modelswarm-eligibility", "dep:ed25519-dalek", "dep:rand_core", "dep:time"]
# ADR-032 light-up tier: the VerifyDrafts serve loop + requester client
# (session-negotiation, gate driving, result signing, budget/WAIT_COMMIT
# housekeeping). OFF by default — default builds are behavior-identical to
# the pre-feature state; the family rides the ADR-018 amended staging
# (raw-JSON frames over the handshake-authenticated transport) through the
# `VerifyDraftsWire` port. The QUIC `Libp2pSession` integration is BLOCKED
# on the transport-crate JSON-passthrough gap recorded in
# docs/reviews/handoff-windows-product-verifydrafts-wiring-2026-10-11.md.
verifydrafts = ["dep:modelswarm-transport", "dep:modelswarm-session", "dep:bs58"]
# Self-test path (ADR-019): turns on the TEST-ONLY mock runtime and the
# `self-test` CLI subcommand. OFF by default — production node builds never
# enable the mock runtime. `cargo test -p modelswarm-node` gets the same
# feature through the dev-dependency below, so the self-test unit test runs
# without extra flags.
node-selftest = ["modelswarm-runtime/mock-runtime"]

[target.'cfg(windows)'.dependencies]
modelswarm-winjob = { path = "../modelswarm-winjob" }

[dependencies]
modelswarm-transport = { path = "../modelswarm-transport", features = ["libp2p-backend"], optional = true }
modelswarm-eligibility = { path = "../modelswarm-eligibility", optional = true }
modelswarm-session = { path = "../modelswarm-session", optional = true }
ed25519-dalek = { version = "2", optional = true, features = ["rand_core"] }
rand_core = { version = "0.6", optional = true, default-features = false }
time = { version = "0.3", optional = true, features = ["formatting"] }
bs58 = { version = "0.5", optional = true }
async-trait = "0.1"
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
modelswarm-gateway = { path = "../modelswarm-gateway" }
modelswarm-identity = { path = "../modelswarm-identity" }
modelswarm-runtime = { path = "../modelswarm-runtime" }
modelswarm-store = { path = "../modelswarm-store" }
modelswarm-telemetry = { path = "../modelswarm-telemetry" }
modelswarm-tracker-api = { path = "../modelswarm-tracker-api" }
modelswarm-types = { path = "../modelswarm-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
modelswarm-runtime = { path = "../modelswarm-runtime", features = ["mock-runtime"] }
# Shadow-planner integration test only (tests join F15 PeerMetrics
# observations with the frozen cost model); the production node crate
# does NOT depend on the scheduler.
modelswarm-scheduler = { path = "../modelswarm-scheduler" }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

[lints]
workspace = true
