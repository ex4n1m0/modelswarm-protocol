[package]
name = "modelswarm-bench"
description = "Repeatable benchmark harness and network-emulation bindings per ADR-013"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hex = "0.4"
modelswarm-runtime = { path = "../modelswarm-runtime", features = ["mock-runtime"] }
modelswarm-scheduler = { path = "../modelswarm-scheduler" }
modelswarm-types = { path = "../modelswarm-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
