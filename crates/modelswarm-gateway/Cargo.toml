[package]
name = "modelswarm-gateway"
description = "Loopback OpenAI-compatible API: normalization, streaming proxy, retries"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Exposes the gateway's StaticExecutor test doubles outside this crate's own
# test build (e.g. for the Phase D executor integration). OFF by default.
test-doubles = []

[dependencies]
async-trait = "0.1"
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
modelswarm-runtime = { path = "../modelswarm-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
