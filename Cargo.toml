[workspace]
resolver = "2"
members = [
    "crates/modelswarm-types",
    "crates/modelswarm-identity",
    "crates/modelswarm-transport",
    "crates/modelswarm-tracker-api",
    "crates/modelswarm-eligibility",
    "crates/modelswarm-runtime",
    "crates/modelswarm-scheduler",
    "crates/modelswarm-session",
    "crates/modelswarm-speculation",
    "crates/modelswarm-store",
    "crates/modelswarm-gateway",
    "crates/modelswarm-telemetry",
    "crates/modelswarm-bench",
    "crates/modelswarm-node",
    "crates/modelswarm-winjob",
    "crates/modelswarm-relay",
    "crates/modelswarm-resource",
    "crates/modelswarm-desktop",
    "apps/modelswarm-sim",
]
# Release-train tooling lives under tests/ (T/R-owned) OUTSIDE the
# product workspace: it is never compiled by CI guards or the product
# build. tests/updater-manifest-verify replays the shipped updater's
# minisign verification over the staged manifest at every release.
exclude = ["tests/updater-manifest-verify"]

# Single source of the product version: tauri.conf.json omits its
# `version` (Tauri falls back to this package version), so desktop,
# node --version, and the UI all report the same number. Bump HERE only.
# Since 2026-10-13 editing this version auto-triggers the 4-OS
# desktop-installer build (its push.paths includes Cargo.toml): the
# bump commit is exactly where shippable artifacts must come from.
[workspace.package]
version = "0.2.26"
edition = "2021"
license = "Proprietary"
repository = "modelswarm"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Project code is held to warnings-denied from Phase 0 onward.
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
