[package]
name = "modelswarm-scheduler"
description = "Candidate filtering and predicted-completion-time peer selection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
modelswarm-types = { path = "../modelswarm-types" }
# F15 observation types (pure data; no libp2p features needed) — the
# shadow-planner mapping consumes PeerObservations. Transport does not
# depend on the scheduler, so this edge is acyclic.
modelswarm-transport = { path = "../modelswarm-transport" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
