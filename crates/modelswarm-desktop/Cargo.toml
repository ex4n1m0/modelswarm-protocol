[package]
name = "modelswarm-desktop"
description = "ModelSwarm desktop UI shell (Tauri 2, ADR-008)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
# The real Tauri 2 shell. OFF by default so the workspace builds anywhere
# (the tauri/wry dependency tree is heavy and platform-specific). Enable with
# `cargo check -p modelswarm-desktop --features tauri-shell`. See
# docs/verification/phase-g-notes.md for the Phase G attempt outcome.
# Since the ADR-032 light-up (2026-10-12) the shell chains the family:
# the shipped build path (`cargo build -p modelswarm-desktop --features
# tauri-shell`) produces a binary with the composed daemon and the real
# batch-verify engine compiled IN — the family rides the same libp2p
# listener as msp-v1 serving, behind the RC-L1 profile-bound lease gate.
tauri-shell = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-build",
    "dep:modelswarm-node",
    "dep:modelswarm-tracker-api",
    "dep:modelswarm-store",
    "dep:modelswarm-gateway",
    "dep:modelswarm-identity",
    "dep:modelswarm-telemetry",
    "dep:modelswarm-scheduler",
    "dep:futures-util",
    "dep:tokio",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "verifydrafts-capi",
]
# ADR-032 light-up tier in the desktop: the composed daemon
# (serve_sessions_composed — ONE listener, BOTH vocabularies, the RC-L1
# production FamilyLeaseSource). Without tauri-shell this only turns the
# node crate's family tier on for library consumers; the desktop's swap
# itself lives in app.rs (compiled only under tauri-shell).
verifydrafts = ["dep:modelswarm-node", "modelswarm-node/verifydrafts"]
# The G4 engine bridge (implies `verifydrafts` and Runtime's
# `capi-adapter`): the family's real C-API batch-verify engine. The
# desktop degrades HONESTLY when the bridge cannot init (plain msp-v1
# serving + a visible reason — never a silent family-off).
verifydrafts-capi = ["verifydrafts", "modelswarm-node/verifydrafts-capi"]

[target.'cfg(windows)'.dependencies]
modelswarm-winjob = { path = "../modelswarm-winjob" }

[dependencies]
modelswarm-transport = { path = "../modelswarm-transport", features = ["libp2p-backend"] }

tauri = { version = "2", optional = true, default-features = false, features = ["wry"] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
modelswarm-node = { path = "../modelswarm-node", optional = true, features = ["libp2p-backend"] }
modelswarm-tracker-api = { path = "../modelswarm-tracker-api", optional = true }
modelswarm-store = { path = "../modelswarm-store", optional = true }
modelswarm-gateway = { path = "../modelswarm-gateway", optional = true }
modelswarm-identity = { path = "../modelswarm-identity", optional = true }
modelswarm-telemetry = { path = "../modelswarm-telemetry", optional = true }
# Shadow-mode scheduler wiring (dependency-graph edge 11): ranks the
# roster with the frozen cost model over F15 measurements and logs the
# decision; never acts on it.
modelswarm-scheduler = { path = "../modelswarm-scheduler", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "rt", "sync", "time"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
# "stream": incremental SSE consumption for the per-delta chat path (P1).
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[build-dependencies]
tauri-build = { version = "2", optional = true, default-features = false , features = [] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
