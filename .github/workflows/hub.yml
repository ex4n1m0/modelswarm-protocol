name: hub

on:
  push:
    branches: [main]
    paths: ["hub/**", ".github/workflows/hub.yml"]
  pull_request:
    paths: ["hub/**", ".github/workflows/hub.yml"]

defaults:
  run:
    working-directory: hub

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
