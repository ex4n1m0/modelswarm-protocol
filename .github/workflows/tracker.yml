name: tracker

on:
  push:
    branches: [main]
    paths: ["apps/tracker/**", "protocol/vectors/**", "catalog/schema-v2.json", ".github/workflows/tracker.yml"]
  pull_request:
    paths: ["apps/tracker/**", "protocol/vectors/**", "catalog/schema-v2.json", ".github/workflows/tracker.yml"]

defaults:
  run:
    working-directory: apps/tracker

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tracker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run validate:vectors
