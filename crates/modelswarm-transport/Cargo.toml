[package]
name = "modelswarm-transport"
description = "Signed-frame loopback transport (ADR-018 Phase C staging); libp2p at Phase F"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# F11 (Phase F stretch): rust-libp2p backend — QUIC (peer-authenticated by
# its libp2p TLS handshake) with keys from the InstallationIdentity seed.
# Optional and experimental; the workspace stays green without it (ADR-018:
# the trait is the swap point).
libp2p-backend = ["dep:libp2p", "dep:futures"]

[dependencies]
modelswarm-identity = { path = "../modelswarm-identity" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
# Signing the P2P handshake. Key material and id derivation come from
# modelswarm-identity (whose raw-sign helper is crate-private); we rebuild the
# ed25519 SigningKey from the identity seed, so no identity logic is duplicated.
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
futures = { version = "0.3", optional = true }
libp2p = { version = "0.57", optional = true, features = [
    "tokio",
    "quic",
    "noise",
    "yamux",
    "identify",
    "ping",
    "macros",
] }

[lints]
workspace = true
