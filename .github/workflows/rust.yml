name: rust

on:
  push:
    branches: [main]
    paths: ["crates/**", "apps/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "protocol/**", "catalog/**", "runtime-pins.json", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "apps/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "protocol/**", "catalog/**", "runtime-pins.json", ".github/workflows/rust.yml"]
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Matches rust-toolchain.toml's exact pin (a floating stable let a
      # clippy lint promotion break main between local runs and CI).
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      # The serving bridge, lease gate (ADR-026), and RemoteExecutor live
      # behind this feature — without this step the enforcement point and
      # the whole P2P path ship uncompiled and untested (that is exactly
      # how the 2026-10-08 lease interop break went unnoticed).
      - name: Clippy (libp2p-backend feature)
        run: cargo clippy --workspace --all-targets --features modelswarm-node/libp2p-backend -- -D warnings
      - name: Tests (libp2p-backend feature)
        run: cargo test --workspace --features modelswarm-node/libp2p-backend
      # ADR-032 light-up tier: the VerifyDrafts serve loop + requester
      # client are OFF by default — without this step they ship uncompiled
      # and untested (the same blind spot the libp2p-backend step closes).
      # libp2p-backend is EXPLICIT (T/R 2026-10-12): the composed daemon
      # (verifydrafts/composed.rs + tests/verifydrafts_composed.rs) is
      # cfg'd on BOTH features; its CI coverage previously depended on
      # cargo's workspace-wide bare-feature side effect enabling the
      # desktop dep-spec — an implicit chain whose silent breakage would
      # drop the demux tests to 0 tests while staying green.
      - name: Clippy (verifydrafts feature)
        run: cargo clippy --workspace --all-targets --features modelswarm-node/verifydrafts,modelswarm-node/libp2p-backend -- -D warnings
      - name: Tests (verifydrafts feature)
        run: cargo test --workspace --features modelswarm-node/verifydrafts,modelswarm-node/libp2p-backend
      # ADR-031: the C-API research adapter carries the workspace's unsafe
      # FFI — an uncompiled feature is the same CI blind spot that hid the
      # 2026-10-08 lease break (review ruling: land now, not at
      # productionization).
      - name: Clippy (capi-adapter feature)
        run: cargo clippy --workspace --all-targets --features modelswarm-runtime/capi-adapter -- -D warnings
      - name: Tests (capi-adapter feature)
        run: cargo test --workspace --features modelswarm-runtime/capi-adapter
      # The G4 bridge: node/verifydrafts-capi composes the family with the
      # real C-API engine (the trait-cycle resolution lives in the node
      # crate). Without this step the bridge and its disclosure mapping
      # ship uncompiled in the exact combination production will flip on.
      # libp2p-backend EXPLICIT for the same reason as the verifydrafts
      # step above: production's composed daemon needs both, and the
      # combo must not lean on implicit feature unification.
      - name: Clippy (verifydrafts + capi combo)
        run: cargo clippy --workspace --all-targets --features modelswarm-node/verifydrafts-capi,modelswarm-node/libp2p-backend -- -D warnings
      - name: Tests (verifydrafts + capi combo)
        run: cargo test --workspace --features modelswarm-node/verifydrafts-capi,modelswarm-node/libp2p-backend
      # Desktop chat orchestration (send_chat/try_swarm_chat/earn_lease)
      # compiles only with tauri-shell; the stub build runs zero of it.
      # app.rs (2,300+ lines) previously shipped with ZERO clippy coverage
      # (audit F11) — this pass is the lint-clean baseline the gate
      # requires before any app.rs refactor. Same TAURI_CONFIG overlay as
      # the test step: clippy executes build scripts, and clean runners
      # never stage the gitignored engines.
      - name: Clippy (tauri-shell feature)
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo clippy -p modelswarm-desktop --all-targets --features tauri-shell -- -D warnings
      - name: Desktop tests (tauri-shell feature)
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo test -p modelswarm-desktop --features tauri-shell

  # NON-WINDOWS compile gate for the workspace's unsafe surface (added at
  # the 0.2.21 release train, third strike of the windows-only-CI blind
  # spot: wire bugs -> feature unification -> OS). ffi.rs's
  # cfg(not(windows)) branch compiled NOWHERE in CI until the light-up
  # chained tauri-shell -> capi-adapter into desktop-installer: the check
  # job above runs on windows-latest (where the branch is cfg'd out) and
  # desktop-installer only triggers on desktop/node path changes, so a
  # runtime-only change shipped a red 3-OS matrix unnoticed (run
  # 38238154483: E0133 libloading::Library::new on ubuntu+macos). This
  # job compiles every crate + the capi-adapter feature on Linux for every
  # push that touches the rust paths. Compile-only: no engine staging, no
  # test execution — engine-verified Linux behavior stays with the
  # installer matrix and the manual-dispatch real-model tier.
  check-nonwindows-capi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Same TAURI_CONFIG overlay as the check job's desktop steps: clippy
      # executes build scripts, and the desktop build script requires the
      # gitignored engine dirs unless resources are stripped.
      - name: Clippy (workspace, capi-adapter, non-Windows)
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo clippy --workspace --all-targets --features modelswarm-runtime/capi-adapter -- -D warnings

  # Release hygiene guards: the product version is single-sourced in the
  # workspace Cargo.toml (tauri.conf.json must NOT carry its own), and no
  # binary artifact may ever be committed (installers ship via the
  # gitignored downloads dir only).
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: No binaries are committed
        run: |
          if git ls-files | grep -E '\.(exe|dll|gguf|deb|AppImage|dmg|msi|zip|7z|bin)$'; then
            echo "::error::binary artifacts must never be committed (installers ship via gitignored downloads)"
            exit 1
          fi
      # Pattern-based secret scan (no key material in this file): the
      # advisory-plane API key lives ONLY in local client config outside
      # the repo (owner directive 2026-10-12) — a tracked provider-key
      # pattern is a leak by definition.
      - name: No provider API keys are committed
        run: |
          LEAK=$(git ls-files -z | xargs -0 grep -rlE 'sk-[0-9a-f]{32}' -- 2>/dev/null | grep -vx '.github/workflows/rust.yml' || true)
          if [ -n "$LEAK" ]; then
            echo "::error::API-key pattern (sk-<32 hex>) found in tracked files — keys live only in local client config, never in the repo: $LEAK"
            exit 1
          fi
      - name: Version is single-sourced
        run: |
          if jq -e 'has("version")' crates/modelswarm-desktop/tauri.conf.json; then
            echo "::error::tauri.conf.json must not set version — it single-sources from workspace Cargo.toml (Tauri falls back to the package version)"
            exit 1
          fi
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::workspace version not a plain semver: $VERSION"
            exit 1
          fi
          echo "workspace version: $VERSION"
          # The staged download manifest must match the product version
          # (a drift here 404s every /api/download link). Retargeted from
          # page.tsx at 89f6b83: the landing no longer lists downloads —
          # SHA256SUMS.txt is the canonical filename surface now.
          if ! grep -q "ModelSwarm-Setup-$VERSION-windows-x64.exe" apps/tracker/public/downloads/SHA256SUMS.txt; then
            echo "::error::apps/tracker/public/downloads/SHA256SUMS.txt does not match version $VERSION (stale or missing windows installer entry)"
            exit 1
          fi
      # The check job's tauri-shell test strips bundle.resources via the
      # TAURI_CONFIG overlay (engines are staged only by the installer
      # workflows, which also verify per-file hashes inside artifacts) —
      # this assertion keeps the shipping resource set drift-detectable
      # on every push despite that test-only overlay.
      - name: Bundle resources are frozen
        run: |
          EXPECTED='["engine/*","engine-vulkan/*"]'
          ACTUAL=$(jq -c '.bundle.resources' crates/modelswarm-desktop/tauri.conf.json)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::tauri.conf.json bundle.resources drifted: $ACTUAL (expected $EXPECTED)"
            exit 1
          fi
